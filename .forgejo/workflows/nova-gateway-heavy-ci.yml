name: Forgejo heavy gateway CI

on:
  push:
    branches:
      - fix/nova-gateway-bootstrap-phase-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-gateway-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39

      - name: Install locked test environment
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev

      - name: Compile Telegram adapter
        run: uv run python -m compileall -q plugins/platforms/telegram/adapter.py

      - name: Run gateway regression suite
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          uv run python -m pytest -q -p no:cacheprovider \
            tests/gateway/test_telegram_init_deadline.py \
            tests/gateway/test_telegram_start_polling_timeout.py \
            tests/gateway/test_telegram_network_reconnect.py \
            tests/gateway/test_telegram_error_redaction.py \
            tests/gateway/test_platform_reconnect.py

      - name: Check committed diff whitespace
        run: git diff --check HEAD^ HEAD
